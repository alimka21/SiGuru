    <!-- Favicon: Blue Book Icon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📘</text></svg>">
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "primary": "#137fec",
              "background-light": "#f6f7f8",
            },
            fontFamily: {
              sans: ["Manrope", "sans-serif"],
            },
          },
        },
      }
    </script>
    <style>
      /* Global Scaling Logic */
      html {
        /* Mengubah base font-size menjadi 90%. 
           Karena Tailwind menggunakan REM, ini akan mengecilkan seluruh UI 
           (padding, margin, font, width) secara proporsional. */
        font-size: 90%; 
      }

      body {
        font-family: 'Manrope', sans-serif;
        background-color: #f6f7f8;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      /* Custom scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        height: 8px;
        width: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      /* Sticky columns for matrix table */
      .sticky-col {
        position: sticky;
        left: 0;
        z-index: 20;
      }
      .sticky-col-2 {
        position: sticky;
        left: 48px; /* Width of first column */
        z-index: 20;
      }
    </style>
